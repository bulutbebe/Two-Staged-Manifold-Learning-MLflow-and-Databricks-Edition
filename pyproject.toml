[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hankel-anomaly-ml"
version = "0.1.0"
description = "Production-oriented starter for Hankel autoencoder anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tracking = ["mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
